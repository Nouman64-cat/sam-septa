# ==============================================================================
# Shared base URLs for all scrapers
# ==============================================================================
urls:
  septa:
    base_url: "https://epsadmin.septa.org/vendor/login/"


# ==============================================================================
# SEPTA Scraper – all tuneable settings (credentials stay in .env)
# ==============================================================================
septa:

  logging:
    log_file: "logs/septa_scraper.log"

  browser:
    window_size: "1920,1080"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    disable_images: true

  timeouts:
    element_wait: 30
    clickable_wait: 30
    login_redirect_wait: 15
    navigation_sleep: 3
    search_result_wait: 20
    date_field_wait: 5
    next_page_wait: 10
    page_change_sleep: 2

  scraping:
    max_pages: 50

  csv:
    prefix: "septa_quotes_"
    timestamp_format: "%Y%m%d_%H%M%S"

  wdm:
    cache_pattern: ".wdm/drivers/chromedriver/**/chromedriver.exe"

  navigation:
    open_quotes_link_texts:
      - "View Open Quotes"
      - "eProcurement"
      - "Quotations"
      - "Quote Module"
      - "Direct Quote Requests"

    open_quotes_href_patterns:
      - "openquote"
      - "OpenQuote"

    open_quotes_page_keywords:
      - "open quote"
      - "open quotes"

    menu_procurement_keywords:
      - "procurement"
      - "quote"
      - "bid"
      - "tender"

  selectors:
    username_xpath: "//input[contains(@id, 'Username') or contains(@name, 'Username') or contains(@id, 'User') or contains(@name, 'User') or contains(@id, 'email') or contains(@name, 'email') or @type='email']"
    username_label_xpath: "//label[contains(text(), 'Login ID') or contains(text(), 'User')]/following::input[1]"
    username_fallback_css: "input[type='text']"

    password_xpath: "//input[contains(@id, 'Password') or contains(@name, 'Password') or contains(@id, 'Pass') or contains(@name, 'Pass') or @type='password']"
    password_label_xpath: "//label[contains(text(), 'Password')]/following::input[1]"

    login_btn_xpath: "//a[contains(text(), 'Submit')] | //a[contains(@href, 'doPostBack') and contains(text(), 'Submit')] | //a[contains(@id, 'Submit')] | //button[contains(text(), 'SUBMIT') or contains(text(), 'Submit')] | //input[@value='SUBMIT' or @value='Submit' or @type='submit']"

    logout_xpath: "//a[contains(@href, 'logout')]"
    login_error_xpath: "//*[contains(text(), 'Invalid') or contains(text(), 'Failed')]"

    date_input_xpath: "//*[@id='ctl00_ctl00_masterMain_cntMain_ctl00_txtOpensStartDate'] | //input[contains(@name, 'txtOpensStartDate')] | //input[contains(@id, 'OpenDate') or contains(@name, 'OpenDate') or contains(@id, 'FromDate') or contains(@name, 'FromDate') or contains(@id, 'StartDate') or contains(@name, 'StartDate')] | //input[contains(@class, 'date') and not(contains(@id, 'Close')) and not(contains(@id, 'End'))]"

    search_btn_xpath: "//a[contains(text(), 'Search') or contains(text(), 'SEARCH')] | //a[contains(@id, 'Search') or contains(@id, 'btnSearch')] | //button[contains(text(), 'Search') or contains(text(), 'SEARCH')] | //input[@value='Search' or @value='SEARCH' or @type='submit'] | //*[@id='searchButton'] | //*[contains(@class, 'search-btn')]"

    data_table_wait_xpath: "//table[contains(@class, 'data') or contains(@class, 'table') or @id]"

    table_selectors:
      - "//table[contains(@class, 'data') or contains(@class, 'table')]"
      - "//table[@id]"
      - "//table[.//th]"
      - "//div[contains(@class, 'table')]//table"
      - "//*[@role='table' or @role='grid']"

    next_page_selectors:
      - "//a[contains(text(), 'Next')]"
      - "//a[contains(text(), 'next')]"
      - "//a[text()='>']"
      - "//a[contains(text(), ' > ')]"
      - "//input[@class='next']"
      - "//a[contains(@id, 'btnNext')]"
      - "//a[contains(@id, 'Next')]"

    open_quotes_search_xpath: "//button[contains(text(), 'Search')]"
    open_quotes_date_placeholder_xpath: "//input[contains(@placeholder, 'Date')]"

